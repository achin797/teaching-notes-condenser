AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Telegram -> Gemini condense -> Notion pipeline for class notes.

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
    Description: Random string; also passed as secret_token when registering the Telegram webhook.
  AllowedChatId:
    Type: String
    Description: Your Telegram numeric user id (from @userinfobot). Only this chat may use the bot.
  NotionToken:
    Type: String
    NoEcho: true
  NotionDataSourceId:
    Type: String
    Description: >
      From the database's settings menu: Manage data sources -> Copy data source ID.
  DriveDocId:
    Type: String
    Description: >
      File ID of the Google Doc that mirrors the Notion DB for NotebookLM, from
      its URL: docs.google.com/document/d/<FILE_ID>/edit. The Doc must be owned
      by a real Google account (not the service account) and shared as Editor
      with the VertexProject's teaching-notes-vertex service account.
  NotionStudentsProperty:
    Type: String
    Default: Multi-select
    Description: Notion multi-select property holding student names, exported into the Doc.
  VertexProject:
    Type: String
    Description: >
      GCP project id billed for Vertex AI. Auth is Workload Identity Federation
      via app/gcp-wif-credentials.json — there is no key or API key to supply.
  VertexLocation:
    Type: String
    Default: global
    Description: Vertex AI location. "global" avoids per-region model availability checks.
  GeminiModelId:
    Type: String
    Default: gemini-3.6-flash
    Description: Gemini model id, e.g. gemini-3.6-flash.
  LocalTz:
    Type: String
    Default: Asia/Kolkata

Resources:
  BufferTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expireAt
        Enabled: true

  CondenserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
          ALLOWED_CHAT_ID: !Ref AllowedChatId
          NOTION_TOKEN: !Ref NotionToken
          NOTION_DATA_SOURCE_ID: !Ref NotionDataSourceId
          NOTION_VERSION: "2026-03-11"
          VERTEX_PROJECT: !Ref VertexProject
          VERTEX_LOCATION: !Ref VertexLocation
          GEMINI_MODEL_ID: !Ref GeminiModelId
          # Workload Identity Federation config. Contains no secret — only pool,
          # provider and service-account references. /var/task is the Lambda root.
          GOOGLE_APPLICATION_CREDENTIALS: /var/task/gcp-wif-credentials.json
          LOCAL_TZ: !Ref LocalTz
          BUFFER_TABLE: !Ref BufferTable
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BufferTable

  DriveSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: drive_sync.handler
      Runtime: python3.12
      # ~1 Notion call per session plus rate-limit pacing; generous headroom
      # past current volume (50 sessions ~= 20s).
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          NOTION_TOKEN: !Ref NotionToken
          NOTION_DATA_SOURCE_ID: !Ref NotionDataSourceId
          NOTION_VERSION: "2026-03-11"
          NOTION_STUDENTS_PROPERTY: !Ref NotionStudentsProperty
          DRIVE_DOC_ID: !Ref DriveDocId
          # Same WIF credentials file as CondenserFunction, requesting a
          # Drive scope instead of a Vertex one.
          GOOGLE_APPLICATION_CREDENTIALS: /var/task/gcp-wif-credentials.json
          LOCAL_TZ: !Ref LocalTz
          BUFFER_TABLE: !Ref BufferTable
      # No FunctionUrlConfig: scheduled only, never a public endpoint.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BufferTable
      Events:
        # Weekend polling, every 6h, IST. EventBridge Scheduler (ScheduleV2)
        # is used rather than plain Schedule (EventBridge Rules) because only
        # Scheduler supports ScheduleExpressionTimezone — IST's UTC+5:30
        # offset can't be expressed cleanly as a UTC cron for "weekend".
        WeekendPoll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 0/6 ? * SAT,SUN *)"
            ScheduleExpressionTimezone: Asia/Kolkata
        # Weekend polling ends Sun 18:00 IST; a Sunday-evening class would
        # otherwise wait until the following Saturday. This closes that gap.
        MondayCatchUp:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 0 ? * MON *)"
            ScheduleExpressionTimezone: Asia/Kolkata

Outputs:
  FunctionUrl:
    Description: Register this as the Telegram webhook URL.
    Value: !GetAtt CondenserFunctionUrl.FunctionUrl
  BufferTableName:
    Value: !Ref BufferTable
  DriveSyncFunctionName:
    Description: Invoke manually to force a sync outside the weekend schedule.
    Value: !Ref DriveSyncFunction
